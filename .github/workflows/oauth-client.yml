name: OAuth Client and Servers
on:
  push:
    paths: ['moli-quick-oauth/**', 'pom.xml', 'moli-quick-dependencies/pom.xml', '.github/workflows/oauth-client.yml']
  pull_request:
    paths: ['moli-quick-oauth/**', 'pom.xml', 'moli-quick-dependencies/pom.xml', '.github/workflows/oauth-client.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: oauth_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oauth_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: oauth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U oauth_test -d oauth_test"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit, protocol and real storage integration tests
        env:
          OAUTH_TEST_MYSQL_URL: 'jdbc:mysql://127.0.0.1:3306/oauth_test?allowPublicKeyRetrieval=true&useSSL=false&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true'
          OAUTH_TEST_MYSQL_USERNAME: root
          OAUTH_TEST_MYSQL_PASSWORD: test-only-password
          OAUTH_TEST_POSTGRESQL_URL: 'jdbc:postgresql://127.0.0.1:5432/oauth_test'
          OAUTH_TEST_POSTGRESQL_USERNAME: oauth_test
          OAUTH_TEST_POSTGRESQL_PASSWORD: test-only-password
          OAUTH_TEST_REDIS_PORT: '6379'
        run: >-
          mvn -B -ntp -pl :moli-quick-oauth-auth-server-spring-boot-starter,:moli-quick-oauth-resource-server-spring-boot-starter,:moli-quick-oauth-client-github,:moli-quick-oauth-client-qq,:moli-quick-oauth-client-wechat,:moli-quick-oauth-client-google,:moli-quick-oauth-client-microsoft,:moli-quick-oauth-client-apple,:moli-quick-oauth-client-jdbc,:moli-quick-oauth-client-redis,:moli-quick-oauth-client-spring-boot-starter
          -am -Poauth-it -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.compiler.proc=full verify

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Quick dependencies for independent examples
        run: >-
          mvn -B -ntp -pl :moli-quick-dependencies,:moli-quick-oauth-auth-server-spring-boot-starter -am
          -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.compiler.proc=full install
      - name: Build and run independent OAuth applications
        shell: bash
        run: |
          for app in authorization-server resource-server client; do
            mvn -B -ntp -f "moli-quick-oauth/examples/$app/pom.xml" -Dmaven.compiler.proc=full verify
          done
          python moli-quick-oauth/examples/smoke.py
